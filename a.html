<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECRUTEMENT // PROTOCOLE_PARTENARIAT</title>
    <!-- Polices spécifiques au style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- =================================================================
         PARTIE CSS - DESIGN SYNTHWAVE
    ================================================================== -->
    <style>
        :root {
            --glow-cyan: #00f6ff;
            --glow-magenta: #ff00c1;
            --background-deep-blue: #0c0c2c;
            --background-dark-purple: #1d1135;
            --text-color: #e5e5e5;
            --cyan-shadow: 0 0 5px var(--glow-cyan), 0 0 10px var(--glow-cyan), 0 0 20px var(--glow-cyan);
            --magenta-shadow: 0 0 5px var(--glow-magenta), 0 0 10px var(--glow-magenta), 0 0 20px var(--glow-magenta);
        }

        /* --- 1. Fond d'écran avec grille animée --- */
        body {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-color);
            background-color: var(--background-deep-blue);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Empêche les barres de défilement dues aux éléments de fond */
        }

        #background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--glow-cyan) 1px, transparent 1px),
                linear-gradient(to right, var(--glow-cyan) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 -1000px; }
        }

        /* --- 2. Structure principale et titres --- */
        .main-container {
            width: 100%;
            max-width: 750px;
            position: relative; /* Pour être au-dessus du fond */
            z-index: 1;
        }

        .main-container h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 60px;
            color: #fff;
            text-shadow: var(--magenta-shadow);
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: var(--magenta-shadow); opacity: 1; }
            20%, 24%, 55% { text-shadow: none; opacity: 0.8; }
        }

        /* --- 3. Formulaires style HUD --- */
        .form-container {
            background: rgba(29, 17, 53, 0.5);
            backdrop-filter: blur(2px);
            padding: 30px;
            border: 1px solid var(--glow-magenta);
            box-shadow: inset 0 0 15px rgba(255, 0, 193, 0.3), 0 0 15px rgba(255, 0, 193, 0.3);
            margin-bottom: 50px;
            position: relative;
        }
        
        /* Effet de scanlines (lignes de balayage) */
        .form-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(12,12,44,0) 50%, rgba(12,12,44,0.4) 51%);
            background-size: 100% 4px;
            animation: scanlines 5s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scanlines {
            from { background-position: 0 0; }
            to { background-position: 0 -20px; }
        }

        .form-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            text-transform: uppercase;
            color: var(--glow-cyan);
            text-shadow: var(--cyan-shadow);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* --- 4. Champs de saisie --- */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-form label {
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--glow-cyan);
            text-shadow: 0 0 3px var(--glow-cyan);
            margin-bottom: -10px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid rgba(0, 246, 255, 0.5);
            font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-color);
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-bottom-color: var(--glow-cyan);
            box-shadow: 0 5px 15px -10px var(--glow-cyan);
        }

        /* --- 5. Bouton d'envoi --- */
        .contact-form button {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 14px 20px;
            background-color: transparent;
            color: var(--glow-magenta);
            border: 2px solid var(--glow-magenta);
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s, text-shadow 0.3s;
            text-shadow: var(--magenta-shadow);
            box-shadow: inset 0 0 10px rgba(255, 0, 193, 0.5), 0 0 10px rgba(255, 0, 193, 0.5);
            margin-top: 10px;
        }

        .contact-form button:hover:not(:disabled) {
            background-color: var(--glow-magenta);
            color: var(--background-deep-blue);
            text-shadow: none;
        }
        
        /* --- 6. Messages de statut --- */
        .form-status-message {
            margin-top: 20px;
            font-weight: 600;
            padding: 12px 15px;
            text-align: center;
            text-transform: uppercase;
            border: 1px solid;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s, transform 0.3s;
            visibility: hidden;
        }
        
        .form-status-message.visible { opacity: 1; transform: translateY(0); visibility: visible; }
        .form-status-message.success { border-color: var(--glow-cyan); color: var(--glow-cyan); text-shadow: var(--cyan-shadow); }
        .form-status-message.error { border-color: #ff4f4f; color: #ff4f4f; text-shadow: 0 0 5px #ff4f4f; }
        
        /* Autres styles inchangés (spinner, etc.) */
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; display: none; }
        .button--loading .spinner { display: block; }
        .button--loading .button-text { visibility: hidden; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .contact-form button:disabled { background-color: #333; border-color: #555; color: #777; cursor: not-allowed; box-shadow: none; text-shadow: none; }
    </style>
</head>
<body>
    <div id="background-grid"></div>

    <div class="main-container">
      <h2>SYSTEM_ACCESS</h2>

      <!-- Formulaire de Candidature -->
      <div class="form-container">
        <h3 class="form-title"><i data-feather="user-plus"></i>INITIATE: RECRUITMENT_PROTOCOL</h3>
        <form id="candidature-form" class="contact-form" novalidate>
          <label for="discord-player">CALLSIGN [DISCORD]</label>
          <input id="discord-player" type="text" name="discord" required>

          <label for="pr-player">COMBAT_RATING [PR/DIV]</label>
          <input id="pr-player" type="text" name="pr" required>

          <label for="tracker-player">TRACKER_LINK</label>
          <input id="tracker-player" type="url" name="tracker" required>

          <label for="presentation-player">PERSONNEL_FILE</label>
          <textarea id="presentation-player" name="presentation" required></textarea>

          <button type="submit"><span class="button-text">TRANSMIT_APPLICATION</span><div class="spinner"></div></button>
          <p class="form-status-message" id="candidature-message"></p>
        </form>
      </div>

      <!-- Formulaire de Partenariat -->
      <div class="form-container">
        <h3 class="form-title"><i data-feather="briefcase"></i>REQUEST: ALLIANCE_PROTOCOL</h3>
        <form id="partenaire-form" class="contact-form" novalidate>
          <label for="nom-structure-partner">ORGANIZATION_ID</label>
          <input id="nom-structure-partner" type="text" name="nom_structure" required>

          <label for="email-partner">COMMS_CHANNEL [EMAIL]</label>
          <input id="email-partner" type="email" name="email" required>

          <label for="proposition-partner">PROPOSAL_DATA</label>
          <textarea id="proposition-partner" name="proposition" required></textarea>

          <button type="submit"><span class="button-text">SEND_PROPOSAL</span><div class="spinner"></div></button>
          <p class="form-status-message" id="partenaire-message"></p>
        </form>
      </div>
    </div>

    <script>
      feather.replace({
          'stroke-width': 1.5,
          color: 'var(--glow-cyan)'
      });
    </script>
    
    <!-- Le JavaScript reste le même, il est déjà robuste -->
    <script>
        (function() {
            emailjs.init("pMwdLWhRC_47k_8LL");
            function setupFormHandler(formId, serviceId, templateId, messageElementId) {
                const form = document.getElementById(formId);
                if (!form) return;
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    const messageElement = document.getElementById(messageElementId);
                    const submitButton = form.querySelector('button[type="submit"]');
                    submitButton.disabled = true;
                    submitButton.classList.add('button--loading');
                    messageElement.classList.remove('visible', 'success', 'error');
                    emailjs.sendForm(serviceId, templateId, this)
                        .then(() => {
                            messageElement.textContent = "TRANSMISSION_SUCCESSFUL";
                            messageElement.classList.add('success', 'visible');
                            form.reset();
                        }, (error) => {
                            messageElement.textContent = "TRANSMISSION_FAILED: CONNECTION_ERROR";
                            messageElement.classList.add('error', 'visible');
                            console.error('Erreur EmailJS:', error);
                        })
                        .finally(() => {
                            submitButton.disabled = false;
                            submitButton.classList.remove('button--loading');
                        });
                });
            }
            setupFormHandler('candidature-form', 'service_mj22iql', 'template_candidature', 'candidature-message');
            setupFormHandler('partenaire-form', 'service_mj22iql', 'template_partenaire', 'partenaire-message');
        })();
    </script>

</body>
</html>
